# Engine clippy configuration (ENG-002). Clippy reads only the nearest
# clippy.toml, so this file repeats every root setting and adds the
# determinism bans. `cargo xtask arch` fails if a root entry is missing here.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Project vocabulary that is not code ("..", keeps clippy's defaults).
doc-valid-idents = ["JetStream", "PostgreSQL", "OpenTelemetry", "OpenAPI", "ETag", "UUIDv7", ".."]

max-fn-params-bools = 1
too-many-arguments-threshold = 6

disallowed-methods = [
    { path = "std::thread::sleep", reason = "blocks the async runtime; use tokio::time::sleep" },
    { path = "std::env::var", reason = "CFG-001: read configuration once at startup through the typed config struct" },
    { path = "std::env::var_os", reason = "CFG-001: read configuration once at startup through the typed config struct" },
    # ---- Engine determinism (ENG-002): time, randomness and identity are inputs.
    { path = "std::time::SystemTime::now", reason = "ENG-002: pass the instant in as an argument" },
    { path = "std::time::Instant::now", reason = "ENG-002: engines are not timed internally" },
    { path = "chrono::Utc::now", reason = "ENG-002: pass the instant in as an argument" },
    { path = "chrono::Local::now", reason = "ENG-002: pass the instant in as an argument" },
    { path = "uuid::Uuid::now_v7", reason = "ENG-002: identifiers are generated by the orchestrator" },
]

disallowed-types = [
    { path = "axum::Json", reason = "API-003: use api_kit::Json (problem+json rejections)" },
    { path = "axum::extract::Path", reason = "API-003: use api_kit::Path (problem+json rejections)" },
    { path = "axum::extract::Query", reason = "API-003: use api_kit::Query (problem+json rejections)" },
    # ---- Engine purity (ENG-001): no I/O primitives.
    { path = "std::fs::File", reason = "ENG-001: engines perform no I/O" },
    { path = "std::net::TcpStream", reason = "ENG-001: engines perform no I/O" },
    { path = "std::net::UdpSocket", reason = "ENG-001: engines perform no I/O" },
    { path = "std::process::Command", reason = "ENG-001: engines perform no I/O" },
    { path = "std::collections::HashMap", reason = "ENG-002: iteration order is random; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "ENG-002: iteration order is random; use BTreeSet" },
]
