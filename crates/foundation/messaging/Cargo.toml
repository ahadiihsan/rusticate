[package]
name = "messaging"
description = "Outbox relay, idempotent event consumers, JetStream adapter, platform maintenance (SOP MSG-*)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# In-memory EventSink for tests of crates that relay events.
testing = []

[dependencies]
async-nats.workspace = true
chrono.workspace = true
datastore.workspace = true
futures.workspace = true
http.workspace = true
op-context = { workspace = true, features = ["mint"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
telemetry.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
messaging = { path = ".", features = ["testing"] }
test-kit.workspace = true

[lints]
workspace = true
