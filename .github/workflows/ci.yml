# CI runs exactly what engineers and agents run locally: `cargo xtask ci`.
# YAML only provisions the machine; every rule lives in the repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: verify (fmt, arch, lint, docs, deny, contract, tests, coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup installs the exact toolchain from rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,cargo-deny,cargo-llvm-cov

      - name: Install sqlx-cli
        run: |
          command -v sqlx >/dev/null || cargo install sqlx-cli --version 0.9.0 \
            --no-default-features --features postgres,rustls,sqlx-toml

      - name: Start Postgres and NATS
        run: cargo xtask db up

      - name: cargo xtask ci
        run: cargo xtask ci

      - name: Coverage (TEST-006, ≥ 80 % lines)
        run: cargo xtask coverage --fail-under 80

      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            target/nextest/ci/junit.xml
            lcov.info
          if-no-files-found: ignore

  migrations:
    name: migrations (immutability, squawk)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # DB-011: merged migrations are immutable. Fix forward with a new one.
      - name: Merged migrations are unchanged
        run: |
          changed=$(git diff --name-only --diff-filter=MDR \
            "origin/${{ github.base_ref }}...HEAD" -- '*/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Merged migrations must never change. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi

      - name: Lint new migrations (squawk)
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" -- '*/migrations/*.sql')
          if [ "${#added[@]}" -eq 0 ]; then echo "no new migrations"; exit 0; fi
          npx --yes squawk-cli@2.69.0 "${added[@]}"

  image:
    name: container images build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
