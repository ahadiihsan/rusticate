# Dependency updates arrive as small, reviewable PRs (SUP-004). CI runs
# cargo-deny, the full test suite and the architecture checks on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [minor, patch]
  # Actions are pinned by commit SHA (a moved or compromised tag cannot change
  # what CI runs). Dependabot bumps the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
