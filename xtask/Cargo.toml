[package]
name = "xtask"
description = "Project automation and architecture enforcement: the single entry point for engineers, agents and CI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
iam = { workspace = true, features = ["dev-tokens"] }
op-context.workspace = true
proc-macro2.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# rusticate:module(postgres):start
sha2.workspace = true
# rusticate:module(postgres):end
syn.workspace = true
toml.workspace = true
uuid.workspace = true
walkdir.workspace = true

# Tooling is exempt from the product lints (it prints, it reads the
# environment), but keeps the correctness ones.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
